# Сценарии работы пользователя в браузере (pytest + Playwright), снимки экрана, фактические результаты.
# Запуск вручную; при save=true результаты сохраняются в docs/evidence отдельным коммитом.
name: e2e

on:
  workflow_dispatch:
    inputs:
      save:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      LANG: ru_RU.UTF-8
      TZ: Asia/Yekaterinburg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.3.3 playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: dotnet build IssueDesk.sln -c Release
      - name: Тесты
        run: dotnet test IssueDesk.sln --no-build -c Release --logger "console;verbosity=normal" 2>&1 | tee tests.txt
      - name: Сценарии
        run: |
          rm -rf docs/evidence/screens docs/evidence/scenarios.json
          cd IssueDesk && rm -f issuedesk.db
          nohup dotnet run --no-build -c Release --urls http://localhost:5097 > /tmp/a1.log 2>&1 &
          cd ..
          for i in $(seq 1 60); do curl -s http://localhost:5097 > /dev/null && break; sleep 1; done
          python -m pytest tests/e2e -m "not restart" -v -p no:cacheprovider --tb=line 2>&1 | tee pytest-main.txt || true
          pkill -f IssueDesk || true; sleep 3
          cd IssueDesk
          nohup dotnet run --no-build -c Release --urls http://localhost:5097 > /tmp/a2.log 2>&1 &
          cd ..
          for i in $(seq 1 60); do curl -s http://localhost:5097 > /dev/null && break; sleep 1; done
          python -m pytest tests/e2e -m restart -v -p no:cacheprovider --tb=line 2>&1 | tee pytest-restart.txt || true
          pkill -f IssueDesk || true
          cp tests.txt docs/evidence/tests.txt
          grep -iE "fail|exception" /tmp/a1.log | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: docs/evidence
      - name: Сохранение
        if: ${{ inputs.save }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/evidence
          git commit -m "Результаты сценариев в браузере и снимки экрана [skip ci]" || echo "нет изменений"
          git push
