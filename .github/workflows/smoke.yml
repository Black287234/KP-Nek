# Запуск приложения и обход основных страниц (проверка, что страницы открываются без ошибок)
name: smoke

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build -c Release
      - name: Smoke
        run: bash tools/smoke.sh
