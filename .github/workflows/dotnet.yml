# Сборка решения и запуск тестов при каждой отправке изменений
name: dotnet

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build IssueDesk.sln -c Release
      - run: dotnet test IssueDesk.sln -c Release --no-build
