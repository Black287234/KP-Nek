# Формирование миграции EF Core на сервере GitHub (запуск вручную); миграция сохраняется отдельным коммитом
name: ef-migration

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Имя миграции'
        required: true

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install --global dotnet-ef --version 10.0.15
      - run: dotnet ef migrations add ${{ inputs.name }} --project IssueDesk --output-dir Data/Migrations
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add IssueDesk/Data/Migrations
          git commit -m "Миграция ${{ inputs.name }}"
          git push
